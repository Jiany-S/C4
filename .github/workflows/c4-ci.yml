name: C4 verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RUN_LIVE: "false"
      RUN_UI: "false"
      OPENAI_API_KEY: ""
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Test manual graph and tools
        run: python -m pytest tests -q
      - name: Execute notebook
        run: python scripts/execute_notebook.py
      - name: Verify Gradio HTTP and queue
        run: python scripts/smoke_gradio.py
